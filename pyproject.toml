[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "message-variant-lab"
version = "0.1.0"
description = "Deterministic comparison of recorded outreach structures"
requires-python = ">=3.10"

[project.scripts]
mvl = "message_variant_lab.cli:main"

[tool.setuptools.packages.find]
include = ["message_variant_lab*"]
